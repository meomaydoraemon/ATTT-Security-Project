# Thứ tự nạp luật. Đường dẫn là đường dẫn bên trong container nginx-waf.

# 1. Cấu hình engine (dựa trên file mặc định của image owasp/modsecurity-crs)
Include /etc/nginx/modsecurity/modsecurity.conf

# 2. Không có file ghi đè chế độ ở đây: listener prod luôn SecRuleEngine On.
#    Chỉ listener lab có override riêng (nginx.conf, include /etc/nginx/waf-lab/*.conf).

# 3. Cấu hình CRS mặc định của image, rồi phần tinh chỉnh cho API của nhóm
Include /opt/owasp-crs/crs-setup.conf
Include /etc/nginx/modsecurity/crs-tuning.conf

# 4. Luật tùy chỉnh (ngoại lệ + vá ảo) chạy trước bộ luật CRS
Include /etc/nginx/modsecurity/custom-rules/*.conf

# 5. OWASP Core Rule Set
Include /opt/owasp-crs/rules/*.conf
