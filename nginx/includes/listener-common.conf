# Phần dùng chung cho mọi listener HTTPS (prod 8443 và lab 9443), include trong từng khối server.
# Giữ ở một chỗ để hai listener có cùng TLS, WAF, header và chính sách không công khai.

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# ModSecurity + OWASP CRS cho mọi location của server include file này
include /etc/nginx/modsecurity/modsec-nginx.conf;

# 403 do WAF tự sinh (không áp cho 403 của backend vì proxy_intercept_errors đang tắt)
error_page 403 = @waf_blocked;
# Không còn node nào phản hồi (hoặc lab đang tắt)
error_page 502 503 504 = @upstream_unavailable;

# Failover: node lỗi/không phản hồi thì chuyển ngay sang node kia
proxy_connect_timeout 1s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Header gửi xuống backend. Nginx là điểm vào duy nhất nên ghi đè (không nối thêm)
# X-Forwarded-For bằng IP thật, tránh client tự điền IP giả vào audit log.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Mã 32 ký tự hex do Nginx sinh, cũng là mã giao dịch trong audit log WAF
proxy_set_header X-Request-ID $request_id;

proxy_hide_header X-Request-ID;   # backend trả lại cùng ID, chỉ giữ 1 header do Nginx gắn
add_header X-Request-ID $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
# Cho biết node nào đã xử lý, tiện quan sát Demo 1 (chỉ dùng trong môi trường demo)
add_header X-Upstream $upstream_addr always;

# Actuator: chỉ health được công khai (location riêng trong từng server)
location /actuator/ {
    return 404;
}

# Tài liệu API (Swagger/OpenAPI) không công khai ra ngoài.
location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs) {
    return 404;
}

# ----- Phản hồi do Nginx tự sinh -----
location @waf_blocked {
    modsecurity off;
    default_type application/json;
    add_header X-Blocked-By waf always;
    add_header X-Request-ID $request_id always;
    return 403 '{"status":403,"message":"Request blocked by WAF","requestId":"$request_id"}';
}
location @upstream_unavailable {
    modsecurity off;
    default_type application/json;
    add_header X-Request-ID $request_id always;
    return 503 '{"status":503,"message":"Service unavailable (backend down)","requestId":"$request_id"}';
}
