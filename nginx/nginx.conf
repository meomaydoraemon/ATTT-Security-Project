# Image owasp/modsecurity-crs chạy nginx bằng user không đặc quyền (uid 101):
# nghe cổng 8080/8443/9443 trong container (compose map 8443 -> 443, 9443 -> 9443), pid đặt ở /tmp.
load_module modules/ngx_http_modsecurity_module.so;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                 # không lộ phiên bản Nginx trong header/trang lỗi
    client_max_body_size 1m;           # API JSON không cần body lớn

    # ---------- Log: có request ID và node đã xử lý, dùng làm minh chứng Demo 1 ----------
    # srv= ở cuối dòng cho biết listener (8443 prod, 9443 lab); giữ nguyên thứ tự các trường cũ.
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'rid=$request_id upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time srv=$server_port';
    access_log /var/log/nginx/access.log main;

    # ---------- DNS nội bộ của Docker ----------
    # Phân giải lại tên node mỗi 5s: Nginx vẫn khởi động/restart được khi một node (hoặc lab) đang tắt.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ---------- Rate Limiting ----------
    # Vùng chung cho toàn bộ API: 5 request/giây mỗi IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;
    # Vùng chặt hơn cho đăng nhập, chống brute-force: 5 request/phút mỗi IP
    limit_req_zone $binary_remote_addr zone=loginlimit:10m rate=5r/m;
    # Listener lab dùng vùng riêng, cùng tốc độ, để demo lab không làm cạn hạn mức của prod
    limit_req_zone $binary_remote_addr zone=lab_api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=lab_login:10m rate=5r/m;
    limit_req_status 429;   # trả 429 Too Many Requests thay vì 503 mặc định

    # ---------- Load Balancing (Round-Robin) + passive health check ----------
    upstream backend_cluster {
        zone backend_cluster 64k;      # bắt buộc khi dùng `resolve`
        # Passive health check: 1 lần lỗi là tạm loại node 15s, sau đó thử lại 1 request.
        server backend-node-1:8080 resolve max_fails=1 fail_timeout=15s;
        server backend-node-2:8080 resolve max_fails=1 fail_timeout=15s;
        keepalive 16;
    }

    # Lab tách biệt (profile lab). `resolve`: Nginx vẫn chạy khi lab tắt, listener lab trả 503 JSON.
    upstream lab_cluster {
        zone lab_cluster 64k;
        server lab-backend:8080 resolve max_fails=1 fail_timeout=15s;
        keepalive 8;
    }

    # ---------- HTTP nội bộ ----------
    # Không publish ra host (đề cương: chỉ mở 443); chỉ dùng cho healthcheck bên trong container.
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS prod (SSL Termination) + WAF ----------
    server {
        listen 8443 ssl;
        server_name localhost;
        include /etc/nginx/includes/listener-common.conf;

        # Endpoint đăng nhập: rate limit chặt
        location = /api/v1/auth/login {
            limit_req zone=loginlimit burst=5 nodelay;
            proxy_pass http://backend_cluster;
        }

        location = /actuator/health {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend_cluster;
        }

        # API cố ý lỗi chỉ có ở listener lab. Lớp thứ hai, ngoài việc node prod không đăng ký route này.
        location ^~ /api/v1/vuln/ {
            default_type application/json;
            return 404 '{"status":404,"message":"Endpoint not found"}';
        }

        # Mọi API khác (gồm cụm vá /api/v1/secure) tới cụm 2 node prod
        location / {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend_cluster;
        }
    }

    # ---------- HTTPS lab: cùng WAF/TLS/chính sách, upstream và rate limit riêng ----------
    server {
        listen 9443 ssl;
        server_name localhost;
        # Override chế độ WAF chỉ cho listener lab (Demo 3). Phải nạp TRƯỚC modsecurity_rules_file trong
        # listener-common.conf: khi luật được nạp thành nhiều lần, libmodsecurity giữ SecRuleEngine đặt trước
        # (đã đo: đặt sau thì không có tác dụng). Thư mục là tmpfs: không có file => lab On.
        # Đổi bằng scripts/waf-mode.sh lab On|DetectionOnly.
        include /etc/nginx/waf-lab/*.conf;
        include /etc/nginx/includes/listener-common.conf;

        location = /api/v1/auth/login {
            limit_req zone=lab_login burst=5 nodelay;
            proxy_pass http://lab_cluster;
        }

        location = /actuator/health {
            limit_req zone=lab_api burst=10 nodelay;
            proxy_pass http://lab_cluster;
        }

        # Cụm vá /api/v1/secure và cụm lỗi /api/v1/vuln của lab-backend
        location / {
            limit_req zone=lab_api burst=10 nodelay;
            proxy_pass http://lab_cluster;
        }
    }
}
